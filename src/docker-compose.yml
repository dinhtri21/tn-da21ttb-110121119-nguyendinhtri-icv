version: "3.9"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: icv-server
    expose: # chỉ expose nội bộ cho nginx
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - Cors__AllowedOrigins__0=https://icv.codes
      - Frontend__DefaultOrigin=https://icv.codes
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-YourIssuer}
      - Jwt__Audience=${JWT_AUDIENCE:-YourAudience}
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Authentication__Google__RedirectUri=${GOOGLE_REDIRECT_URI}
      - Authentication__Google__CallbackPath=${GOOGLE_CALLBACK_PATH}
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - Tavily__ApiKey=${TAVILY_API_KEY}
      - MongoDbSettings__ConnectionString=${MONGODB_CONNECTION_STRING}
      - MongoDbSettings__DatabaseName=${MONGODB_DATABASE_NAME:-iCV}
    networks:
      - icv-network
    volumes:
      - server_uploads:/app/Uploads
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API: "https://icv.codes/api"   
    container_name: icv-client
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API=https://icv.codes/api
    depends_on:
      - server
    networks:
      - icv-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: icv-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro # nếu dùng certbot
    depends_on:
      - client
      - server
    networks:
      - icv-network
    restart: unless-stopped

networks:
  icv-network:
    driver: bridge

volumes:
  server_uploads:
    name: icv_uploads
